version: "2"

formatters:
  enable:
    - gci
    - gofumpt
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/evcoreco/octane)
      custom-order: true
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
    golines:
      max-len: 120

linters:
  default: none
  enable:
    # --- Bugs / correctness ---
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - nilerr
    - noctx
    - durationcheck
    - makezero
    - reassign
    - bidichk
    # --- Security ---
    - gosec
    # --- Complexity / size ---
    # One linter per metric. revive's overlapping rules are not enabled.
    - cyclop
    - funlen
    - gocognit
    - maintidx
    - nestif
    # --- Style / correctness-adjacent ---
    - revive
    - misspell
    - unconvert
    - unparam
    - wastedassign
    - prealloc
    - copyloopvar
    - goconst
    - gocritic
    - predeclared
    - usestdlibvars
    - intrange
    # --- Imports / dependencies ---
    - depguard
    # --- Whitespace / layout ---
    - wsl_v5
    # --- Lint hygiene ---
    - nolintlint

  settings:
    cyclop:
      max-complexity: 10
    funlen:
      lines: 75
      statements: 50
    gocognit:
      min-complexity: 15
    nestif:
      min-complexity: 5

    exhaustive:
      # A default branch does not count as handling every enum value.
      check: [switch, mapliteral]
      default-signifies-exhaustive: false

    nolintlint:
      allow-unused: false
      require-specific: true
      require-explanation: true

    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2

    revive:
      # Rules are listed explicitly so that a revive upgrade cannot add rules.
      # Not enabled, because another linter owns the check:
      #   - complexity and size: cyclomatic, cognitive-complexity,
      #     function-length, max-control-nesting, argument-limit,
      #     function-result-limit, max-public-structs, file-length-limit
      #     (cyclop, gocognit, funlen, nestif); line-length-limit (golines)
      #   - errcheck: unhandled-error; unparam: unused-parameter;
      #     goconst: add-constant; predeclared: redefines-builtin-id
      #   - govet: atomic, struct-tag, unreachable-code, waitgroup-by-value
      #   - copyloopvar: range-val-address, range-val-in-closure
      #   - staticcheck: dot-imports (ST1001), error-strings (ST1005),
      #     error-return (ST1008), time-naming (ST1011), error-naming
      #     (ST1012), duplicated-imports (ST1019), context-keys-type (SA1029),
      #     unconditional-recursion (SA5007)
      # Not enabled, because they do nothing without project-specific
      # arguments: banned-characters, comments-density, file-header,
      # imports-blocklist, string-format.
      # Not enabled by choice: package-directory-mismatch.
      rules:
        - name: bare-return
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: call-to-gc
        - name: comment-spacings
        - name: confusing-naming
        - name: confusing-results
        - name: constant-logical-expr
        - name: context-as-argument
        - name: datarace
        - name: deep-exit
        - name: defer
        - name: early-return
        - name: empty-block
        - name: empty-lines
        - name: enforce-map-style
        - name: enforce-repeated-arg-type-style
        - name: enforce-slice-style
        - name: enforce-switch-style
        - name: epoch-naming
        - name: errorf
        - name: exported
        - name: filename-format
        - name: flag-parameter
        - name: forbidden-call-in-wg-go
        - name: get-return
        - name: identical-branches
        - name: identical-ifelseif-branches
        - name: identical-ifelseif-conditions
        - name: identical-switch-branches
        - name: identical-switch-conditions
        - name: if-return
        - name: import-alias-naming
        - name: import-shadowing
        - name: increment-decrement
        - name: indent-error-flow
        - name: inefficient-map-lookup
        - name: marshal-receiver
        - name: modifies-parameter
        - name: modifies-value-receiver
        - name: multiline-if-init
        - name: nested-structs
        - name: optimize-operands-order
        - name: package-comments
        - name: package-naming
        - name: range
        - name: receiver-naming
        - name: redundant-build-tag
        - name: redundant-import-alias
        - name: redundant-test-main-exit
        - name: string-of-int
        - name: superfluous-else
        - name: time-date
        - name: time-equal
        - name: unchecked-type-assertion
        - name: unexported-naming
        - name: unexported-return
        - name: unnecessary-format
        - name: unnecessary-if
        - name: unnecessary-stmt
        - name: unsecure-url-scheme
        - name: unused-receiver
        - name: use-any
        - name: use-errors-new
        - name: use-fmt-print
        - name: use-slices-concat
        - name: use-slices-sort
        - name: use-waitgroup-go
        - name: useless-break
        - name: useless-fallthrough
        - name: var-declaration
        - name: var-naming
          arguments:
            - []  # allowlist  (empty = defaults)
            - []  # denylist   (empty = defaults)
            - - skipPackageNameChecks: true

    depguard:
      rules:
        main:
          allow:
            - $gostd
            # This module.
            - github.com/evcoreco/octane
            # Approved direct third-party dependencies (see go.mod). Add new
            # direct deps here, otherwise depguard will reject their imports.
            - github.com/coder/websocket
            - github.com/spf13/cobra
            - github.com/spf13/cobra/doc
            - go.yaml.in/yaml/v3

  exclusions:
    generated: strict
    warn-unused: true
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      - path: '(.+)_test\.go'
        linters:
          - cyclop
          - funlen
          - gocognit
          - goconst
          - maintidx

issues:
  # Report every finding. The defaults (50 per linter, 3 per message)
  # hide most of the work when a check fails.
  max-issues-per-linter: 0
  max-same-issues: 0
